<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservar cita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --negro:#1a1a1a; --crema:#FAF7F4; --rosa:#D4537E; --rosa-suave:#F7E8EF; --dorado:#C9A96E; --gris:#8a8a8a; }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Jost',sans-serif;background:var(--crema);color:var(--negro);}

    .nav{padding:20px 48px;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:0.5px solid #e8e0d8;}
    .nav-logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;letter-spacing:0.12em;color:var(--negro);}
    .nav-back{font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gris);cursor:pointer;text-decoration:none;transition:color 0.2s;}
    .nav-back:hover{color:var(--negro);}

    .container{max-width:680px;margin:0 auto;padding:48px 24px 100px;}
    .page-title{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:300;margin-bottom:8px;}
    .page-sub{font-size:14px;color:var(--gris);margin-bottom:40px;}

    .srv-pill{display:inline-flex;align-items:center;gap:12px;background:white;border:1px solid #e8e0d8;padding:14px 20px;margin-bottom:40px;}
    .srv-pill-label{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gris);display:block;margin-bottom:2px;}
    .srv-pill-nombre{font-family:'Cormorant Garamond',serif;font-size:18px;}
    .srv-pill-dur{font-size:13px;color:var(--gris);}

    .bloque-titulo{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--dorado);margin-bottom:20px;display:flex;align-items:center;gap:12px;}
    .bloque-titulo::after{content:'';flex:1;height:0.5px;background:#e8e0d8;}

    /* CALENDARIO */
    .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
    .cal-header h3{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;}
    .cal-nav{background:none;border:1px solid #e8e0d8;width:36px;height:36px;cursor:pointer;font-size:16px;transition:all 0.2s;display:flex;align-items:center;justify-content:center;}
    .cal-nav:hover{background:var(--negro);color:white;border-color:var(--negro);}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:40px;}
    .cal-day-name{text-align:center;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gris);padding:8px 0;}
    .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:all 0.15s;position:relative;}
    .cal-day:hover:not(.disabled):not(.empty){background:var(--rosa-suave);}
    .cal-day.selected{background:var(--rosa);color:white;}
    .cal-day.today::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--rosa);}
    .cal-day.selected.today::after{background:white;}
    .cal-day.disabled{color:#d0c8c0;cursor:not-allowed;}
    .cal-day.empty{cursor:default;}
    .cal-day.bloqueado{color:#d0c8c0;cursor:not-allowed;text-decoration:line-through;}

    /* HORARIOS */
    .horarios-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:40px;}
    .hora-btn{padding:12px 4px;text-align:center;border:1px solid #e8e0d8;font-size:14px;cursor:pointer;background:white;transition:all 0.15s;font-family:'Jost',sans-serif;}
    .hora-btn:hover:not(.disabled){border-color:var(--rosa);color:var(--rosa);}
    .hora-btn.selected{background:var(--negro);color:white;border-color:var(--negro);}
    .hora-btn.disabled{background:#f5f2ef;color:#c8c0b8;cursor:not-allowed;}

    /* FORM */
    .form-group{margin-bottom:20px;}
    label{display:block;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gris);margin-bottom:8px;}
    input,select,textarea{width:100%;padding:14px 0;border:none;border-bottom:1px solid #e8e0d8;background:transparent;font-size:15px;color:var(--negro);font-family:'Jost',sans-serif;outline:none;transition:border-color 0.2s;}
    input:focus,select:focus,textarea:focus{border-bottom-color:var(--negro);}
    textarea{resize:vertical;min-height:80px;}

    .btn-confirmar{width:100%;background:var(--negro);color:white;border:none;padding:18px;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;font-family:'Jost',sans-serif;margin-top:8px;transition:background 0.2s;}
    .btn-confirmar:hover{background:var(--rosa);}
    .btn-confirmar:disabled{opacity:0.5;cursor:not-allowed;}

    .spinner{width:32px;height:32px;border:2px solid #e8e0d8;border-top-color:var(--rosa);border-radius:50%;animation:spin 0.7s linear infinite;margin:40px auto;}
    @keyframes spin{to{transform:rotate(360deg);}}

    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--negro);color:white;padding:12px 24px;font-size:13px;z-index:999;transition:transform 0.3s;white-space:nowrap;}
    #toast.show{transform:translateX(-50%) translateY(0);}
    #toast.error{background:#A32D2D;}

    @media(max-width:640px){.nav{padding:16px;}.horarios-grid{grid-template-columns:repeat(3,1fr);}}
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo" id="nav-logo">Salón</div>
  <a href="../index.html" class="nav-back">← Volver</a>
</nav>

<div class="container">
  <h1 class="page-title">Reservar cita</h1>
  <p class="page-sub">Elegí la fecha y hora que más te convenga</p>

  <div class="srv-pill">
    <div>
      <span class="srv-pill-label">Servicio seleccionado</span>
      <div class="srv-pill-nombre" id="srv-nombre">—</div>
    </div>
    <div class="srv-pill-dur" id="srv-dur"></div>
  </div>

  <p class="bloque-titulo">Seleccioná una fecha</p>
  <div class="cal-header">
    <button class="cal-nav" id="btn-prev">←</button>
    <h3 id="cal-titulo"></h3>
    <button class="cal-nav" id="btn-next">→</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>

  <div id="horarios-section" style="display:none">
    <p class="bloque-titulo">Horarios disponibles</p>
    <div class="horarios-grid" id="horarios-grid"></div>
  </div>

  <div id="form-section" style="display:none">
    <p class="bloque-titulo">Tus datos</p>
    <div class="form-group"><label>Nombre completo</label><input type="text" id="inp-nombre" placeholder="Tu nombre completo"></div>
    <div class="form-group"><label>Teléfono</label><input type="tel" id="inp-telefono" placeholder="8888-8888"></div>
    <div class="form-group"><label>Correo electrónico</label><input type="email" id="inp-correo" placeholder="tu@correo.com"></div>
    <div class="form-group"><label>Nota (opcional)</label><textarea id="inp-nota" placeholder="Alguna indicación especial..."></textarea></div>
    <button class="btn-confirmar" id="btn-confirmar" onclick="confirmarCita()">Confirmar cita</button>
  </div>
</div>

<div id="toast"></div>

<script src="../config.js"></script>
<script type="module">
import { db } from '../js/firebase.js';
import { collection, addDoc, getDocs, query, where, Timestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

document.getElementById('nav-logo').textContent = CONFIG.negocio;
document.title = 'Reservar — ' + CONFIG.negocio;

const servicio = JSON.parse(sessionStorage.getItem('servicio') || 'null');
if (!servicio) { window.location.href = '../index.html'; }
else {
  document.getElementById('srv-nombre').textContent = servicio.nombre;
  document.getElementById('srv-dur').textContent = servicio.duracion + ' min';
}

let fechaSeleccionada = null, horaSeleccionada = null;
let mesActual = new Date(); mesActual.setDate(1);
const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const diasN = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

async function obtenerBloqueados() {
  try {
    const snap = await getDocs(collection(db,'dias_bloqueados'));
    return snap.docs.map(d => d.data().fecha);
  } catch(e) { return []; }
}

async function renderCal() {
  const anio=mesActual.getFullYear(), mes=mesActual.getMonth();
  document.getElementById('cal-titulo').textContent = meses[mes] + ' ' + anio;
  const bloqueados = await obtenerBloqueados();
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const primerDia=new Date(anio,mes,1).getDay();
  const ultimoDia=new Date(anio,mes+1,0).getDate();
  const grid=document.getElementById('cal-grid');
  grid.innerHTML=diasN.map(d=>`<div class="cal-day-name">${d}</div>`).join('');
  for(let i=0;i<primerDia;i++) grid.innerHTML+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=ultimoDia;d++){
    const fecha=new Date(anio,mes,d);
    const fs=`${anio}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const esPasado=fecha<hoy, esBloq=bloqueados.includes(fs);
    const noHabil=!CONFIG.horario.diasHabiles.includes(fecha.getDay());
    const esHoy=fecha.getTime()===hoy.getTime(), esSel=fs===fechaSeleccionada;
    let cls='cal-day';
    if(esPasado||noHabil) cls+=' disabled';
    else if(esBloq) cls+=' bloqueado';
    else if(esSel) cls+=' selected';
    if(esHoy) cls+=' today';
    const clickable=!esPasado&&!noHabil&&!esBloq;
    grid.innerHTML+=`<div class="${cls}" ${clickable?`onclick="elegirFecha('${fs}')"`:''}>${d}</div>`;
  }
}

window.elegirFecha = async function(fecha) {
  fechaSeleccionada=fecha; horaSeleccionada=null;
  renderCal();
  document.getElementById('form-section').style.display='none';
  await renderHorarios(fecha);
};

async function renderHorarios(fecha) {
  const section=document.getElementById('horarios-section');
  const grid=document.getElementById('horarios-grid');
  section.style.display='block';
  grid.innerHTML='<div class="spinner"></div>';
  const ahora=new Date();
  const esHoy=fecha===ahora.toISOString().split('T')[0];
  const horaActual=esHoy?ahora.getHours()+ahora.getMinutes()/60:0;
  let horasBloq=[], citasOcup=[];
  try {
    const s1=await getDocs(query(collection(db,'horas_bloqueadas'),where('fecha','==',fecha)));
    s1.forEach(d=>{ if(d.data().hora!==undefined) horasBloq.push(d.data().hora); });
    const s2=await getDocs(query(collection(db,'citas'),where('fecha','==',fecha),where('estado','!=','cancelada')));
    s2.forEach(d=>{ if(d.data().hora!==undefined) citasOcup.push(d.data().hora); });
  } catch(e){}
  let html='';
  for(let h=CONFIG.horario.inicio;h<CONFIG.horario.fin;h++){
    for(let m=0;m<60;m+=30){
      const hn=h+m/60;
      const label=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      const pasada=esHoy&&hn<=horaActual;
      const bloq=horasBloq.includes(hn)||citasOcup.includes(hn);
      const sel=hn===horaSeleccionada;
      let cls='hora-btn';
      if(pasada||bloq) cls+=' disabled'; else if(sel) cls+=' selected';
      html+=`<div class="${cls}" ${(!pasada&&!bloq)?`onclick="elegirHora(${hn},'${label}')"`:''}>${label}</div>`;
    }
  }
  grid.innerHTML=html||'<p style="color:var(--gris)">No hay horarios disponibles.</p>';
}

window.elegirHora=function(horaNum,label){
  horaSeleccionada=horaNum;
  document.querySelectorAll('.hora-btn').forEach(b=>b.classList.remove('selected'));
  event.target.classList.add('selected');
  document.getElementById('form-section').style.display='block';
  setTimeout(()=>document.getElementById('form-section').scrollIntoView({behavior:'smooth',block:'start'}),100);
};

window.confirmarCita=async function(){
  const nombre=document.getElementById('inp-nombre').value.trim();
  const telefono=document.getElementById('inp-telefono').value.trim();
  const correo=document.getElementById('inp-correo').value.trim();
  const nota=document.getElementById('inp-nota').value.trim();
  if(!nombre||!telefono||!correo){mostrarToast('Completá todos los campos','error');return;}
  if(!fechaSeleccionada||horaSeleccionada===null){mostrarToast('Elegí fecha y hora','error');return;}
  const btn=document.getElementById('btn-confirmar');
  btn.disabled=true;btn.textContent='Guardando...';
  try {
    await addDoc(collection(db,'citas'),{
      servicio:servicio.nombre,servicioId:servicio.id,duracion:servicio.duracion,precio:servicio.precio,
      fecha:fechaSeleccionada,hora:horaSeleccionada,
      cliente:{nombre,telefono,correo},nota,estado:'pendiente',creadoEn:Timestamp.now()
    });
    sessionStorage.setItem('cita_confirmada',JSON.stringify({servicio:servicio.nombre,fecha:fechaSeleccionada,hora:horaSeleccionada,nombre}));
    window.location.href='confirmacion.html';
  } catch(e){
    mostrarToast('Error al guardar. Intentá de nuevo.','error');
    btn.disabled=false;btn.textContent='Confirmar cita';
  }
};

function mostrarToast(msg,tipo=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='show '+tipo;
  setTimeout(()=>t.className='',3000);
}

document.getElementById('btn-prev').onclick=()=>{mesActual.setMonth(mesActual.getMonth()-1);renderCal();};
document.getElementById('btn-next').onclick=()=>{mesActual.setMonth(mesActual.getMonth()+1);renderCal();};
renderCal();
</script>
</body>
</html>
