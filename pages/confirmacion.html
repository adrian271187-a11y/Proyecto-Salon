<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cita registrada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--negro:#1a1a1a;--crema:#FAF7F4;--rosa:#D4537E;--dorado:#C9A96E;--gris:#8a8a8a;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Jost',sans-serif;background:var(--crema);color:var(--negro);min-height:100vh;display:flex;flex-direction:column;}
    .nav{padding:20px 48px;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:0.5px solid #e8e0d8;}
    .nav-logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;letter-spacing:0.12em;}
    .main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;}
    .card{background:white;max-width:480px;width:100%;padding:56px 48px;text-align:center;border:0.5px solid #e8e0d8;}
    .check-icon{width:64px;height:64px;border:1.5px solid var(--dorado);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 32px;font-size:24px;color:var(--dorado);}
    .card h1{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;margin-bottom:8px;}
    .card p{font-size:14px;color:var(--gris);line-height:1.7;margin-bottom:40px;}
    .info-lista{text-align:left;border-top:0.5px solid #e8e0d8;margin-bottom:32px;}
    .info-row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:0.5px solid #e8e0d8;font-size:14px;}
    .info-row span:first-child{color:var(--gris);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;}
    .info-row span:last-child{font-weight:400;}
    .notice{background:#FAF7F4;border:0.5px solid #e8e0d8;padding:16px 20px;font-size:13px;color:var(--gris);margin-bottom:32px;line-height:1.6;}
    .btn-home{display:block;width:100%;background:var(--negro);color:white;border:none;padding:16px;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;font-family:'Jost',sans-serif;text-align:center;text-decoration:none;transition:background 0.2s;}
    .btn-home:hover{background:var(--rosa);}
    .badge{display:inline-block;font-size:11px;padding:4px 12px;background:#FAEEDA;color:#854F0B;letter-spacing:0.05em;}
  </style>
</head>
<body>
<nav class="nav">
  <div class="nav-logo" id="nav-logo">Salón</div>
</nav>
<div class="main">
  <div class="card">
    <div class="check-icon">✓</div>
    <h1>¡Cita registrada!</h1>
    <p>Tu solicitud fue enviada. Recibirás un correo de confirmación cuando el salón apruebe tu cita.</p>
    <div class="info-lista" id="info-cita"></div>
    <div class="notice">📬 En espera de confirmación — te avisamos por correo.</div>
    <a href="../index.html" class="btn-home">Volver al inicio</a>
  </div>
</div>
<script src="../config.js"></script>
<script>
document.getElementById('nav-logo').textContent = CONFIG.negocio;
document.title = 'Cita registrada — ' + CONFIG.negocio;
const cita = JSON.parse(sessionStorage.getItem('cita_confirmada') || 'null');
if (!cita) { window.location.href = '../index.html'; }
else {
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const [anio,mes,dia] = cita.fecha.split('-');
  const fechaStr = `${dia} de ${meses[parseInt(mes)-1]} de ${anio}`;
  const hs=Math.floor(cita.hora), ms=Math.round((cita.hora-hs)*60);
  const horaStr = `${String(hs).padStart(2,'0')}:${String(ms).padStart(2,'0')}`;
  document.getElementById('info-cita').innerHTML = `
    <div class="info-row"><span>Servicio</span><span>${cita.servicio}</span></div>
    <div class="info-row"><span>Fecha</span><span>${fechaStr}</span></div>
    <div class="info-row"><span>Hora</span><span>${horaStr}</span></div>
    <div class="info-row"><span>Nombre</span><span>${cita.nombre}</span></div>
    <div class="info-row"><span>Estado</span><span><span class="badge">Pendiente de confirmación</span></span></div>`;
}
</script>
</body>
</html>
