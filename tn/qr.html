<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR — TN Esteticista</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Georgia', serif;
      background: #f5f0ee;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 36px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      max-width: 380px;
      width: 100%;
    }
    .logo-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid #C9859A;
      overflow: hidden;
      margin: 0 auto 18px;
      background: #f5f0ee;
    }
    .logo-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .eyebrow {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #C9859A;
      margin-bottom: 6px;
      font-family: 'Georgia', serif;
    }
    h1 {
      font-size: 24px;
      font-weight: normal;
      color: #1C1C1E;
      margin-bottom: 4px;
      font-family: 'Georgia', serif;
    }
    h1 em { font-style: italic; color: #C9859A; }
    .sub {
      font-size: 12px;
      color: #8A8A8E;
      letter-spacing: 0.08em;
      margin-bottom: 28px;
      font-family: Arial, sans-serif;
    }
    .qr-wrap {
      background: #ffffff;
      border: 1.5px solid #e8e0de;
      border-radius: 12px;
      padding: 16px;
      display: inline-block;
      margin-bottom: 22px;
    }
    canvas { display: block; border-radius: 4px; }
    .cta {
      font-size: 13px;
      color: #2E2E32;
      margin-bottom: 6px;
      font-family: Arial, sans-serif;
      font-weight: 600;
    }
    .url {
      font-size: 10px;
      color: #8A8A8E;
      font-family: Arial, sans-serif;
      word-break: break-all;
      margin-bottom: 28px;
    }
    .divider {
      height: 1px;
      background: #ede8e6;
      margin-bottom: 22px;
    }
    .pasos {
      text-align: left;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #5F5E5A;
      line-height: 2;
    }
    .pasos span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #C9859A;
      color: white;
      font-size: 10px;
      font-weight: bold;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .paso { display: flex; align-items: center; margin-bottom: 6px; }
    .btn-dl {
      display: inline-block;
      margin-top: 24px;
      padding: 11px 28px;
      background: #B5728A;
      color: white;
      border: none;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-dl:hover { background: #C9859A; }
    @media print {
      body { background: white; }
      .btn-dl { display: none; }
      .card { box-shadow: none; border: 1px solid #ddd; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-circle">
      <img src="https://proyecto-salon-production.up.railway.app/tn/logo.jpg" onerror="this.style.display='none'" alt="TN">
    </div>
    <div class="eyebrow">Reserva tu cita</div>
    <h1>TN <em>Esteticista</em></h1>
    <div class="sub">Tatiana Núñez · Estética y Bienestar</div>

    <div class="qr-wrap">
      <canvas id="qr"></canvas>
    </div>

    <div class="cta">Escanea y reserva en segundos</div>
    <div class="url">proyecto-salon-production.up.railway.app/tn/cliente/</div>

    <div class="divider"></div>

    <div class="pasos">
      <div class="paso"><span>1</span> Abrí la cámara de tu celular</div>
      <div class="paso"><span>2</span> Apuntá al código QR</div>
      <div class="paso"><span>3</span> Elegí tu servicio y horario</div>
      <div class="paso"><span>4</span> ¡Listo! Tatiana te confirma</div>
    </div>

    <button class="btn-dl" onclick="descargar()">⬇ Descargar QR en PNG</button>
  </div>

  <script>
    const URL_APP = 'https://proyecto-salon-production.up.railway.app/tn/cliente/';

    QRCode.toCanvas(document.getElementById('qr'), URL_APP, {
      width: 220,
      margin: 2,
      color: { dark: '#1C1C1E', light: '#FFFFFF' },
      errorCorrectionLevel: 'H'
    });

    function descargar() {
      QRCode.toDataURL(URL_APP, {
        width: 1000,
        margin: 3,
        color: { dark: '#1C1C1E', light: '#FFFFFF' },
        errorCorrectionLevel: 'H'
      }, function(err, url) {
        if (err) return;
        const a = document.createElement('a');
        a.href = url;
        a.download = 'QR-TN-Esteticista.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });
    }
  </script>
</body>
</html>
