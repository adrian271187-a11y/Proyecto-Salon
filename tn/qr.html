<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR — TN Esteticista</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #1C1C1E;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
    }
    .card {
      background: #2E2E32;
      border: 1px solid rgba(201,133,154,0.25);
      border-radius: 16px;
      padding: 40px 36px;
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    .logo-circle {
      width: 70px; height: 70px;
      border-radius: 50%;
      border: 2px solid rgba(201,133,154,0.4);
      overflow: hidden;
      margin: 0 auto 16px;
      background: #232326;
    }
    .logo-circle img { width: 100%; height: 100%; object-fit: cover; }
    .eyebrow {
      font-size: 10px; letter-spacing: 0.28em;
      text-transform: uppercase; color: #C9859A;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 22px; font-weight: normal;
      color: #F2EEF0; margin-bottom: 4px;
      font-family: Georgia, serif;
    }
    h1 em { font-style: italic; color: #C9859A; }
    .sub { font-size: 12px; color: #8A8A8E; letter-spacing: 0.06em; margin-bottom: 26px; }
    .qr-wrap {
      background: #ffffff;
      border-radius: 12px;
      padding: 14px;
      display: inline-block;
      margin-bottom: 20px;
      line-height: 0;
    }
    .qr-wrap svg { display: block; border-radius: 4px; }
    .cta { font-size: 13px; color: #F2EEF0; margin-bottom: 5px; font-weight: 600; }
    .url { font-size: 10px; color: #6A6A6E; word-break: break-all; margin-bottom: 24px; }
    .divider { height: 1px; background: rgba(255,255,255,0.07); margin-bottom: 20px; }
    .pasos { text-align: left; font-size: 12px; color: #8A8A8E; }
    .paso { display: flex; align-items: center; margin-bottom: 8px; gap: 10px; }
    .paso span {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 50%;
      background: #B5728A; color: white;
      font-size: 10px; font-weight: bold; flex-shrink: 0;
    }
    @media print {
      body { background: white; padding: 0; }
      .card { background: white; border-color: #ddd; margin: 0 auto; }
      h1, .cta { color: #1C1C1E; }
      .qr-wrap { border: 1px solid #ddd; }
    }
  </style>
</head>
