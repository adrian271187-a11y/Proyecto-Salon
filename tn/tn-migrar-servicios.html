<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Migrar servicios TN</title>
  <style>
    body { font-family: monospace; background: #FAF7F4; color: #2C2016; padding: 40px; }
    h2 { color: #C49090; margin-bottom: 24px; }
    #log { background: white; border: 1px solid #EDE4DC; padding: 24px; line-height: 2; }
    .ok  { color: #5A8A6A; }
    .err { color: #C05050; }
    .done{ color: #C49090; font-size: 18px; margin-top: 16px; }
    button { background: #C49090; color: white; border: none; padding: 14px 32px; font-size: 14px; cursor: pointer; margin-bottom: 24px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <h2>🌿 Migrar servicios — TN Esteticista</h2>
  <button id="btn" onclick="migrar()">Iniciar migración</button>
  <div id="log">Presioná el botón para subir todos los servicios a Firestore...</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyCGoJUcpv7T2b87PdtCYbs0YTD7g8_LGuY",
  authDomain: "jireh-spa-f27b3.firebaseapp.com",
  projectId: "jireh-spa-f27b3",
  storageBucket: "jireh-spa-f27b3.firebasestorage.app",
  messagingSenderId: "895355336849",
  appId: "1:895355336849:web:1a6c5192bf3f3f80bde730"
});
const db = firebase.firestore();

const SERVICIOS = [
  {id:'facial-basico',     nombre:'Limpieza facial básica',              categoria:'facial',   duracion:30,  precio:8000,  slots:1, activo:true},
  {id:'punta-diamante',    nombre:'Punta de diamante',                   categoria:'facial',   duracion:30,  precio:15000, slots:1, activo:true},
  {id:'limpieza-profunda', nombre:'Limpieza profunda',                   categoria:'facial',   duracion:60,  precio:20000, slots:2, activo:true},
  {id:'punta-radio',       nombre:'Punta de diamante + Radiofrecuencia', categoria:'facial',   duracion:60,  precio:23500, slots:2, activo:true},
  {id:'radiofrecuencia',   nombre:'Radiofrecuencia',                     categoria:'facial',   duracion:60,  precio:20000, slots:2, activo:true},
  {id:'reductivo',         nombre:'Paquete reductivo',                   categoria:'corporal', duracion:120, precio:185000,slots:4, activo:true},
  {id:'anticelulitis',     nombre:'Paquete anticelulítico',              categoria:'corporal', duracion:120, precio:185000,slots:4, activo:true},
  {id:'relajante',         nombre:'Masaje relajante completo',           categoria:'corporal', duracion:60,  precio:20000, slots:2, activo:true},
  {id:'descontracturante', nombre:'Masaje descontracturante',            categoria:'corporal', duracion:60,  precio:21000, slots:2, activo:true},
  {id:'descarga',          nombre:'Descarga muscular',                   categoria:'corporal', duracion:60,  precio:23000, slots:2, activo:true},
  {id:'piernas',           nombre:'Masaje de piernas',                   categoria:'corporal', duracion:30,  precio:13500, slots:1, activo:true},
  {id:'espalda',           nombre:'Masaje de espalda',                   categoria:'corporal', duracion:30,  precio:13500, slots:1, activo:true},
  {id:'post-op',           nombre:'Masaje post operatorio',              categoria:'corporal', duracion:60,  precio:25000, slots:2, activo:true},
  {id:'drenaje',           nombre:'Drenaje linfático',                   categoria:'corporal', duracion:60,  precio:15000, slots:2, activo:true},
  {id:'limpieza-espalda',  nombre:'Limpieza de espalda',                 categoria:'corporal', duracion:60,  precio:18500, slots:2, activo:true},
];

function log(msg, tipo=''){
  const div = document.getElementById('log');
  div.innerHTML += `<div class="${tipo}">${msg}</div>`;
}

async function migrar(){
  const btn = document.getElementById('btn');
  btn.disabled = true;
  document.getElementById('log').innerHTML = '';
  log('Subiendo servicios a Firestore...');
  let ok=0, err=0;

  for(const svc of SERVICIOS){
    try{
      await db.collection('servicios').doc(svc.id).set({
        nombre: svc.nombre,
        name:   svc.nombre,
        categoria: svc.categoria,
        duracion: svc.duracion,
        slots: svc.slots,
        precio: svc.precio,
        price: svc.precio,
        activo: svc.activo
      });
      log(`✓ ${svc.nombre}`, 'ok');
      ok++;
    }catch(e){
      log(`✗ ${svc.nombre} — ${e.message}`, 'err');
      err++;
    }
  }

  log('─────────────────────────────────────');
  log(`✅ Migración completa — Subidos: ${ok} | Errores: ${err}`, 'done');
  btn.disabled = false;
}
</script>
</body>
</html>
