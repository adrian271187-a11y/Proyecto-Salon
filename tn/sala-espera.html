<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala de Espera — TN Esteticista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --crema:  #FAF7F4; --crema2: #F4EDE8; --crema3: #EDE4DC;
      --rosa:   #D4A8A4; --rosa2:  #C49090; --rosa3:  #B47878;
      --cafe:   #8B6F5E; --cafe2:  #6B4F3E;
      --negro:  #2C2016; --negro2: #3D2E20;
      --gris:   #9A8880; --gris2:  #C4B8B0;
      --verde:  #5A8A6A; --borde:  rgba(180,120,120,0.18);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Jost', sans-serif; background: var(--crema); color: var(--negro); display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }

    /* ── HEADER ── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 60px; background: white; border-bottom: 0.5px solid var(--borde);
      flex-shrink: 0; box-shadow: 0 2px 16px rgba(44,32,22,0.06);
    }
    .header-brand { display: flex; align-items: center; gap: 16px; }
    .header-logo { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid var(--crema3); box-shadow: 0 2px 10px rgba(180,120,120,0.15); }
    .header-info { }
    .header-nombre { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 300; color: var(--negro); line-height: 1.1; }
    .header-nombre em { font-style: italic; color: var(--rosa2); }
    .header-sub { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gris); margin-top: 2px; }
    .header-right { text-align: right; }
    .header-time { font-family: 'Cormorant Garamond', serif; font-size: 52px; font-weight: 300; color: var(--negro); line-height: 1; }
    .header-date { font-size: 11px; font-weight: 200; color: var(--gris); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 2px; }

    /* ── MAIN ── */
    .main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }

    /* ── EN ATENCIÓN ── */
    .atendiendo-panel {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px 80px; text-align: center; position: relative;
      background: white; border-right: 0.5px solid var(--borde);
    }
    .atendiendo-panel::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, var(--rosa), var(--rosa2), var(--cafe));
    }
    .atendiendo-eyebrow {
      font-size: 10px; letter-spacing: 0.6em; text-transform: uppercase; color: var(--rosa2);
      margin-bottom: 28px; display: flex; align-items: center; gap: 16px;
    }
    .atendiendo-eyebrow::before, .atendiendo-eyebrow::after {
      content: ''; width: 32px; height: 0.5px; background: var(--rosa2); opacity: 0.5;
    }
    .atendiendo-indicador {
      width: 14px; height: 14px; background: var(--verde); border-radius: 50%;
      animation: pulso 2s ease-in-out infinite; margin: 0 auto 28px;
      box-shadow: 0 0 0 0 rgba(90,138,106,0.4);
    }
    @keyframes pulso { 0%,100%{box-shadow:0 0 0 0 rgba(90,138,106,0.4)} 50%{box-shadow:0 0 0 18px rgba(90,138,106,0)} }
    .atendiendo-nombre {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(52px, 6vw, 100px); font-weight: 300; line-height: 1;
      margin-bottom: 16px; color: var(--negro);
    }
    .atendiendo-servicio { font-size: 14px; font-weight: 200; color: var(--gris); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; }
    .atendiendo-hora { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: var(--rosa2); }
    .sin-atencion { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; color: var(--gris2); font-style: italic; }

    /* ── COLA ── */
    .cola-panel { display: flex; flex-direction: column; padding: 48px 60px; background: var(--crema); overflow: hidden; }
    .cola-header {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--crema3);
    }
    .cola-titulo { font-size: 10px; letter-spacing: 0.5em; text-transform: uppercase; color: var(--gris); }
    .cola-count { display: flex; align-items: baseline; gap: 8px; }
    .cola-count-num { font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 300; color: var(--rosa2); line-height: 1; }
    .cola-count-label { font-size: 12px; font-weight: 200; color: var(--gris); letter-spacing: 0.1em; }
    .cola-lista { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
    .cola-item {
      display: flex; align-items: center; gap: 20px; padding: 18px 24px;
      background: white; border: 0.5px solid var(--borde);
      box-shadow: 0 2px 10px rgba(44,32,22,0.05); animation: fadeIn 0.4s ease;
      border-radius: 2px;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .cola-item:first-child { border-color: var(--rosa2); box-shadow: 0 4px 16px rgba(180,120,120,0.12); }
    .cola-item:first-child::before { content: ''; position: absolute; }
    .cola-pos {
      font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300;
      color: var(--gris2); min-width: 36px; text-align: center;
    }
    .cola-item:first-child .cola-pos { color: var(--rosa2); }
    .cola-info { flex: 1; }
    .cola-nombre { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; color: var(--negro); line-height: 1.1; }
    .cola-item:first-child .cola-nombre { font-size: 32px; }
    .cola-det { font-size: 12px; font-weight: 200; color: var(--gris); letter-spacing: 0.1em; margin-top: 4px; }
    .cola-hora-badge { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--rosa2); opacity: 0.7; }
    .proximo-pill {
      font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--rosa2);
      background: rgba(212,168,164,0.12); border: 0.5px solid rgba(212,168,164,0.4);
      padding: 4px 10px; display: inline-block; margin-top: 6px; border-radius: 2px;
    }
    .cola-vacia { flex: 1; display: flex; align-items: center; justify-content: center; }
    .cola-vacia p { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; color: var(--gris2); font-style: italic; }

    /* ── FOOTER ── */
    .footer {
      padding: 14px 60px; background: white; border-top: 0.5px solid var(--borde);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .footer-brand { display: flex; align-items: center; gap: 10px; }
    .footer-logo { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid var(--crema3); }
    .footer-msg { font-size: 11px; font-weight: 200; color: var(--gris); letter-spacing: 0.1em; }
    .refresh-indicator { display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--verde); letter-spacing: 0.1em; }
    .refresh-dot { width: 7px; height: 7px; background: var(--verde); border-radius: 50%; animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:0.3} 50%{opacity:1} }

    .spinner { width: 28px; height: 28px; border: 2px solid var(--crema3); border-top-color: var(--rosa2); border-radius: 50%; animation: spin 0.8s linear infinite; margin: auto; }
    @keyframes spin { to{transform:rotate(360deg)} }

    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .atendiendo-panel { padding: 40px 24px; border-right: none; border-bottom: 0.5px solid var(--borde); }
      .atendiendo-nombre { font-size: 48px; }
      .cola-panel { padding: 24px; }
      .header { padding: 16px 24px; }
      .header-time { font-size: 38px; }
      .footer { padding: 12px 24px; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <img class="header-logo" src="/tn/logo.jpg" onerror="this.style.display='none'" alt="TN">
    <div class="header-info">
      <div class="header-nombre">TN <em>Esteticista</em></div>
      <div class="header-sub">Sala de espera</div>
    </div>
  </div>
  <div class="header-right">
    <div class="header-time" id="reloj">--:--</div>
    <div class="header-date" id="fecha-hoy"></div>
  </div>
</div>

<div class="main">
  <div class="atendiendo-panel">
    <div class="atendiendo-eyebrow">En atención</div>
    <div class="atendiendo-indicador" id="indicador" style="display:none"></div>
    <div id="atendiendo-content"><div class="spinner"></div></div>
  </div>
  <div class="cola-panel">
    <div class="cola-header">
      <div class="cola-titulo">Cola de espera</div>
      <div class="cola-count">
        <div class="cola-count-num" id="cola-num">—</div>
        <div class="cola-count-label">en espera</div>
      </div>
    </div>
    <div class="cola-lista" id="cola-lista"><div class="spinner"></div></div>
  </div>
</div>

<div class="footer">
  <div class="footer-brand">
    <img class="footer-logo" src="/tn/logo.jpg" onerror="this.style.display='none'" alt="TN">
    <div class="footer-msg">TN Esteticista · Tatiana Núñez</div>
  </div>
  <div class="refresh-indicator">
    <div class="refresh-dot"></div>
    En tiempo real
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCGoJUcpv7T2b87PdtCYbs0YTD7g8_LGuY",
  authDomain: "jireh-spa-f27b3.firebaseapp.com",
  projectId: "jireh-spa-f27b3",
  storageBucket: "jireh-spa-f27b3.firebasestorage.app",
  messagingSenderId: "895355336849",
  appId: "1:895355336849:web:1a6c5192bf3f3f80bde730"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const mesesN = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const diasSemana = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const SLOT_LABELS = [];
for(let h=8; h<18; h++){ SLOT_LABELS.push(h+':00'); SLOT_LABELS.push(h+':30'); }

function actualizarReloj(){
  const ahora = new Date();
  const h = String(ahora.getHours()).padStart(2,'0');
  const m = String(ahora.getMinutes()).padStart(2,'0');
  document.getElementById('reloj').textContent = `${h}:${m}`;
  document.getElementById('fecha-hoy').textContent =
    `${diasSemana[ahora.getDay()]} ${ahora.getDate()} de ${mesesN[ahora.getMonth()]} ${ahora.getFullYear()}`;
}
actualizarReloj();
setInterval(actualizarReloj, 1000);

function horaLabel(start){
  if(typeof start === 'string' && start.includes(':')) return start;
  return SLOT_LABELS[start] || '—';
}

// Listener en tiempo real
db.collection('queue').orderBy('createdAt').onSnapshot(snap => {
  const items = snap.docs.map(d => ({id: d.id, ...d.data()}));
  const atendiendo = items[0] || null;
  const cola = items.slice(1);

  const contenido = document.getElementById('atendiendo-content');
  const indicador = document.getElementById('indicador');

  if(atendiendo){
    indicador.style.display = 'block';
    const nombre = atendiendo.name || atendiendo.clientName || '—';
    const servicio = atendiendo.service || atendiendo.serviceName || '—';
    const hora = atendiendo.start || atendiendo.hora || '';
    contenido.innerHTML = `
      <div class="atendiendo-nombre">${nombre}</div>
      <div class="atendiendo-servicio">${servicio}</div>
      ${hora ? `<div class="atendiendo-hora">${horaLabel(hora)}</div>` : ''}`;
  } else {
    indicador.style.display = 'none';
    contenido.innerHTML = `<div class="sin-atencion">Nadie siendo atendido</div>`;
  }

  document.getElementById('cola-num').textContent = cola.length;
  const colaEl = document.getElementById('cola-lista');

  if(!cola.length){
    colaEl.innerHTML = `<div class="cola-vacia"><p>Sin clientes en espera</p></div>`;
  } else {
    colaEl.innerHTML = cola.map((c, i) => {
      const nombre = c.name || c.clientName || '—';
      const servicio = c.service || c.serviceName || '—';
      const hora = c.start || c.hora || '';
      return `<div class="cola-item">
        <div class="cola-pos">${i+2}</div>
        <div class="cola-info">
          <div class="cola-nombre">${nombre}</div>
          <div class="cola-det">${servicio}</div>
          ${i===0?'<div class="proximo-pill">Próximo</div>':''}
        </div>
        ${hora?`<div class="cola-hora-badge">${horaLabel(hora)}</div>`:''}
      </div>`;
    }).join('');
  }
});
</script>
</body>
</html>
