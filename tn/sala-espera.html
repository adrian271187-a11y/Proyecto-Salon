<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala de Espera — TN Esteticista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --rosa:   #E9CAC7;
      --rosa2:  #D4A8A4;
      --cafe:   #B4A8A0;
      --negro:  #2C2016;
      --blanco: #FDF8F6;
      --gris:   #8a7f7a;
      --verde:  #4caf50;
      --borde:  rgba(180,168,160,0.25);
      --borde2: rgba(180,168,160,0.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Jost', sans-serif; background: var(--negro); color: var(--blanco); display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }

    .header { display: flex; align-items: center; justify-content: space-between; padding: 24px 60px; border-bottom: 0.5px solid var(--borde); flex-shrink: 0; background: rgba(44,32,22,0.8); }
    .header-logo-wrap { display: flex; align-items: center; gap: 16px; }
    .header-logo-img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--rosa2); }
    .header-logo { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 300; letter-spacing: 0.1em; }
    .header-logo em { font-style: italic; color: var(--rosa2); }
    .header-time { font-family: 'Cormorant Garamond', serif; font-size: 48px; font-weight: 300; color: var(--rosa); line-height: 1; text-align: right; }
    .header-date { font-size: 11px; font-weight: 200; color: var(--gris); letter-spacing: 0.15em; text-transform: uppercase; text-align: right; margin-top: 4px; }

    .main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }

    .atendiendo-panel { background: rgba(233,202,199,0.06); border-right: 0.5px solid var(--borde); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 80px; text-align: center; position: relative; }
    .atendiendo-panel::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 50% at 50% 50%, rgba(233,202,199,0.07) 0%, transparent 70%); pointer-events: none; }
    .atendiendo-eyebrow { font-size: 10px; letter-spacing: 0.6em; text-transform: uppercase; color: var(--rosa2); margin-bottom: 32px; display: flex; align-items: center; gap: 16px; }
    .atendiendo-eyebrow::before, .atendiendo-eyebrow::after { content: ''; width: 32px; height: 0.5px; background: var(--rosa2); opacity: 0.5; }
    .atendiendo-indicador { width: 12px; height: 12px; background: var(--verde); border-radius: 50%; animation: pulso 2s ease-in-out infinite; margin: 0 auto 24px; box-shadow: 0 0 0 0 rgba(76,175,80,0.4); }
    @keyframes pulso { 0%,100%{box-shadow:0 0 0 0 rgba(76,175,80,0.4)} 50%{box-shadow:0 0 0 16px rgba(76,175,80,0)} }
    .atendiendo-nombre { font-family: 'Cormorant Garamond', serif; font-size: clamp(48px, 6vw, 96px); font-weight: 300; line-height: 1; margin-bottom: 16px; color: var(--blanco); }
    .atendiendo-servicio { font-size: 15px; font-weight: 200; color: var(--gris); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; }
    .atendiendo-hora { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: var(--rosa2); opacity: 0.8; }
    .sin-atencion { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; color: rgba(255,255,255,0.2); font-style: italic; }

    .cola-panel { display: flex; flex-direction: column; padding: 48px 60px; overflow: hidden; }
    .cola-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 36px; padding-bottom: 20px; border-bottom: 0.5px solid var(--borde2); }
    .cola-titulo { font-size: 10px; letter-spacing: 0.5em; text-transform: uppercase; color: var(--gris); }
    .cola-count { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; color: var(--rosa2); }
    .cola-count span { font-size: 13px; font-weight: 200; color: var(--gris); letter-spacing: 0.1em; margin-left: 8px; }
    .cola-lista { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
    .cola-item { display: flex; align-items: center; gap: 20px; padding: 18px 24px; background: rgba(233,202,199,0.05); border: 0.5px solid var(--borde2); animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .cola-item:first-child { border-color: rgba(233,202,199,0.3); background: rgba(233,202,199,0.08); }
    .cola-pos { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; color: var(--rosa2); opacity: 0.5; min-width: 40px; text-align: center; }
    .cola-item:first-child .cola-pos { opacity: 1; }
    .cola-info { flex: 1; }
    .cola-nombre { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; line-height: 1.1; }
    .cola-item:first-child .cola-nombre { font-size: 32px; }
    .cola-det { font-size: 12px; font-weight: 200; color: var(--gris); letter-spacing: 0.1em; margin-top: 4px; }
    .cola-hora-badge { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--rosa2); opacity: 0.6; }
    .proximo-badge { font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--rosa2); background: rgba(233,202,199,0.1); border: 0.5px solid rgba(233,202,199,0.3); padding: 4px 10px; display: inline-block; margin-top: 6px; }
    .cola-vacia { flex: 1; display: flex; align-items: center; justify-content: center; }
    .cola-vacia p { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 300; color: rgba(255,255,255,0.15); font-style: italic; }

    .footer { padding: 14px 60px; border-top: 0.5px solid var(--borde); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .footer-msg { font-size: 11px; font-weight: 200; color: var(--gris); letter-spacing: 0.1em; }
    .refresh-dot { width: 6px; height: 6px; background: var(--rosa2); border-radius: 50%; animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:0.3} 50%{opacity:1} }
    .spinner { width: 28px; height: 28px; border: 1px solid rgba(233,202,199,0.2); border-top-color: var(--rosa2); border-radius: 50%; animation: spin 0.8s linear infinite; margin: auto; }
    @keyframes spin { to{transform:rotate(360deg)} }

    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .atendiendo-panel { padding: 40px 24px; border-right: none; border-bottom: 0.5px solid var(--borde); }
      .cola-panel { padding: 24px; }
      .header { padding: 16px 24px; }
      .header-time { font-size: 36px; }
      .footer { padding: 12px 24px; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-logo-wrap">
    <img class="header-logo-img" src="/tn/logo.jpg" onerror="this.style.display='none'" alt="TN">
    <div class="header-logo">TN <em>Esteticista</em></div>
  </div>
  <div>
    <div class="header-time" id="reloj">--:--</div>
    <div class="header-date" id="fecha-hoy"></div>
  </div>
</div>

<div class="main">
  <div class="atendiendo-panel">
    <div class="atendiendo-eyebrow">En atención</div>
    <div class="atendiendo-indicador" id="indicador" style="display:none"></div>
    <div id="atendiendo-content"><div class="spinner"></div></div>
  </div>
  <div class="cola-panel">
    <div class="cola-header">
      <div class="cola-titulo">Cola de espera</div>
      <div class="cola-count"><span id="cola-num">—</span><span>en espera</span></div>
    </div>
    <div class="cola-lista" id="cola-lista"><div class="spinner"></div></div>
  </div>
</div>

<div class="footer">
  <div class="footer-msg">Actualización automática en tiempo real</div>
  <div class="refresh-dot"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCGoJUcpv7T2b87PdtCYbs0YTD7g8_LGuY",
  authDomain: "jireh-spa-f27b3.firebaseapp.com",
  projectId: "jireh-spa-f27b3",
  storageBucket: "jireh-spa-f27b3.firebasestorage.app",
  messagingSenderId: "895355336849",
  appId: "1:895355336849:web:1a6c5192bf3f3f80bde730"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const mesesN = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const diasSemana = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

function actualizarReloj(){
  const ahora = new Date();
  document.getElementById('reloj').textContent =
    `${String(ahora.getHours()).padStart(2,'0')}:${String(ahora.getMinutes()).padStart(2,'0')}`;
  document.getElementById('fecha-hoy').textContent =
    `${diasSemana[ahora.getDay()]}, ${ahora.getDate()} de ${mesesN[ahora.getMonth()]} ${ahora.getFullYear()}`;
}
actualizarReloj();
setInterval(actualizarReloj, 1000);

function horaLabel(h){
  if(typeof h === 'string') return h;
  const hs=Math.floor(h), ms=Math.round((h-hs)*60);
  return `${String(hs).padStart(2,'0')}:${String(ms).padStart(2,'0')}`;
}

function hoyStr(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// Listener en tiempo real con onSnapshot
db.collection('queue').orderBy('createdAt').onSnapshot(snap => {
  const items = [];
  snap.forEach(d => items.push({id: d.id, ...d.data()}));

  const atendiendo = items.find(c => c.status === 'serving' || c.estado === 'en_atencion');
  const cola = items.filter(c => c.status === 'waiting' || c.estado === 'confirmada');

  const contenido = document.getElementById('atendiendo-content');
  const indicador = document.getElementById('indicador');

  if(atendiendo){
    indicador.style.display = 'block';
    const nombre = atendiendo.clientName || atendiendo.name || atendiendo.nombre || '—';
    const servicio = atendiendo.serviceName || atendiendo.servicio || '—';
    const hora = atendiendo.start || atendiendo.hora || '';
    contenido.innerHTML = `
      <div class="atendiendo-nombre">${nombre}</div>
      <div class="atendiendo-servicio">${servicio}</div>
      ${hora ? `<div class="atendiendo-hora">${horaLabel(hora)}</div>` : ''}`;
  } else {
    indicador.style.display = 'none';
    contenido.innerHTML = `<div class="sin-atencion">Nadie siendo atendido</div>`;
  }

  document.getElementById('cola-num').textContent = cola.length;
  const colaEl = document.getElementById('cola-lista');
  if(!cola.length){
    colaEl.innerHTML = `<div class="cola-vacia"><p>Sin clientes en espera</p></div>`;
  } else {
    colaEl.innerHTML = cola.map((c,i) => {
      const nombre = c.clientName || c.name || c.nombre || '—';
      const servicio = c.serviceName || c.servicio || '—';
      const hora = c.start || c.hora || '';
      return `<div class="cola-item">
        <div class="cola-pos">${i+1}</div>
        <div class="cola-info">
          <div class="cola-nombre">${nombre}</div>
          <div class="cola-det">${servicio}</div>
          ${i===0?'<div class="proximo-badge">Próximo</div>':''}
        </div>
        ${hora?`<div class="cola-hora-badge">${horaLabel(hora)}</div>`:''}
      </div>`;
    }).join('');
  }
});
</script>
</body>
</html>
