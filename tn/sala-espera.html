<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="30">
  <title>Sala de Espera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #1C1C1E;
      --bg2:      #232326;
      --bg3:      #2A2A2E;
      --panel:    #252528;
      --rosa:     #C9859A;
      --rosa2:    #B5728A;
      --rosa3:    #D4A0B2;
      --rosa-glow:rgba(201,133,154,0.12);
      --gris:     #8A8A8E;
      --gris2:    #6A6A6E;
      --gris3:    #3A3A3E;
      --blanco:   #F4F0EE;
      --verde:    #5AA87A;
      --borde:    rgba(201,133,154,0.15);
      --borde2:   rgba(255,255,255,0.06);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Jost', sans-serif;
      background: var(--bg);
      color: var(--blanco);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 56px;
      background: var(--bg2);
      border-bottom: 1px solid var(--borde);
      flex-shrink: 0;
    }
    .header-brand { display: flex; flex-direction: column; gap: 4px; }
    .header-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 0.12em;
      color: var(--blanco);
    }
    .header-logo em { font-style: italic; color: var(--rosa); }
    .header-tagline {
      font-size: 10px;
      font-weight: 200;
      color: var(--gris);
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }
    .header-right { display: flex; align-items: flex-end; flex-direction: column; gap: 4px; }
    .header-time {
      font-family: 'Cormorant Garamond', serif;
      font-size: 52px;
      font-weight: 300;
      color: var(--blanco);
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .header-time span { color: var(--rosa); }
    .header-date {
      font-size: 11px;
      font-weight: 200;
      color: var(--gris);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* ── MAIN GRID ── */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }

    /* ── DIVISOR CENTRAL ── */
    .main > * + * { border-left: 1px solid var(--borde2); }

    /* ── EN ATENCIÓN ── */
    .atendiendo-panel {
      background: var(--panel);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 72px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .atendiendo-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 55% at 50% 50%, var(--rosa-glow) 0%, transparent 70%);
      pointer-events: none;
    }
    .atendiendo-eyebrow {
      font-size: 9px;
      letter-spacing: 0.55em;
      text-transform: uppercase;
      color: var(--rosa);
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .atendiendo-eyebrow::before,
    .atendiendo-eyebrow::after {
      content: '';
      width: 28px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--rosa));
      opacity: 0.5;
    }
    .atendiendo-eyebrow::after { background: linear-gradient(270deg, transparent, var(--rosa)); }
    .atendiendo-indicador {
      width: 10px;
      height: 10px;
      background: var(--verde);
      border-radius: 50%;
      animation: pulso 2s ease-in-out infinite;
      margin: 0 auto 20px;
    }
    @keyframes pulso {
      0%,100% { box-shadow: 0 0 0 0 rgba(90,168,122,0.5); }
      50%      { box-shadow: 0 0 0 14px rgba(90,168,122,0); }
    }
    .atendiendo-nombre {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(44px, 5.5vw, 88px);
      font-weight: 300;
      line-height: 1.05;
      color: var(--blanco);
      margin-bottom: 14px;
    }
    .atendiendo-servicio {
      font-size: 13px;
      font-weight: 300;
      color: var(--gris);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .atendiendo-hora {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      color: var(--rosa);
      opacity: 0.75;
    }
    .sin-atencion {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 300;
      color: rgba(255,255,255,0.18);
      font-style: italic;
    }

    /* ── COLA ── */
    .cola-panel {
      background: var(--bg2);
      display: flex;
      flex-direction: column;
      padding: 44px 52px;
      overflow: hidden;
    }
    .cola-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 32px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--borde2);
    }
    .cola-titulo {
      font-size: 9px;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--gris2);
    }
    .cola-count {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .cola-count-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 300;
      color: var(--rosa);
    }
    .cola-count-label {
      font-size: 11px;
      font-weight: 200;
      color: var(--gris2);
      letter-spacing: 0.1em;
    }
    .cola-lista {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .cola-item {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 16px 20px;
      background: var(--bg3);
      border: 1px solid var(--borde2);
      border-radius: 3px;
      animation: fadeIn 0.35s ease;
      transition: border-color 0.2s;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .cola-item:first-child {
      background: rgba(201,133,154,0.06);
      border-color: rgba(201,133,154,0.22);
    }
    .cola-pos {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 300;
      color: var(--gris2);
      min-width: 36px;
      text-align: center;
    }
    .cola-item:first-child .cola-pos { color: var(--rosa); }
    .cola-info { flex: 1; }
    .cola-nombre {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 300;
      color: var(--blanco);
      line-height: 1.1;
    }
    .cola-item:first-child .cola-nombre { font-size: 30px; }
    .cola-det {
      font-size: 11px;
      font-weight: 200;
      color: var(--gris);
      letter-spacing: 0.08em;
      margin-top: 3px;
    }
    .cola-hora-badge {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      color: var(--rosa);
      opacity: 0.65;
    }
    .proximo-badge {
      display: inline-block;
      margin-top: 5px;
      font-size: 8px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--rosa);
      background: rgba(201,133,154,0.1);
      border: 1px solid rgba(201,133,154,0.25);
      padding: 3px 9px;
      border-radius: 2px;
    }
    .cola-vacia {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cola-vacia p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 300;
      color: rgba(255,255,255,0.14);
      font-style: italic;
    }

    /* ── FOOTER ── */
    .footer {
      padding: 14px 56px;
      background: var(--bg2);
      border-top: 1px solid var(--borde2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .footer-msg {
      font-size: 11px;
      font-weight: 200;
      color: var(--gris2);
      letter-spacing: 0.12em;
    }
    .footer-dots { display: flex; gap: 5px; align-items: center; }
    .refresh-dot {
      width: 5px;
      height: 5px;
      background: var(--rosa);
      border-radius: 50%;
      animation: blink 2.2s ease-in-out infinite;
    }
    .refresh-dot:nth-child(2) { animation-delay: 0.3s; }
    .refresh-dot:nth-child(3) { animation-delay: 0.6s; }
    @keyframes blink { 0%,100% { opacity: 0.2; } 50% { opacity: 0.9; } }

    /* ── SPINNER ── */
    .spinner {
      width: 28px; height: 28px;
      border: 1px solid var(--gris3);
      border-top-color: var(--rosa);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .atendiendo-panel { padding: 36px 24px; border-left: none; border-bottom: 1px solid var(--borde2); }
      .atendiendo-nombre { font-size: 44px; }
      .cola-panel { padding: 24px 20px; }
      .header { padding: 18px 20px; }
      .header-time { font-size: 38px; }
      .footer { padding: 12px 20px; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <div class="header-logo" id="h-logo">Salón <em>de Belleza</em></div>
    <div class="header-tagline">Sala de espera</div>
  </div>
  <div class="header-right">
    <div class="header-time" id="reloj">--<span>:</span>--</div>
    <div class="header-date" id="fecha-hoy"></div>
  </div>
</div>

<div class="main">
  <!-- EN ATENCIÓN -->
  <div class="atendiendo-panel">
    <div class="atendiendo-eyebrow">En atención</div>
    <div class="atendiendo-indicador" id="indicador" style="display:none"></div>
    <div id="atendiendo-content"><div class="spinner"></div></div>
  </div>

  <!-- COLA -->
  <div class="cola-panel">
    <div class="cola-header">
      <div class="cola-titulo">Cola de espera</div>
      <div class="cola-count">
        <div class="cola-count-num" id="cola-num">—</div>
        <div class="cola-count-label">en espera</div>
      </div>
    </div>
    <div class="cola-lista" id="cola-lista"><div class="spinner"></div></div>
  </div>
</div>

<div class="footer">
  <div class="footer-msg">Actualización automática cada 30 segundos</div>
  <div class="footer-dots">
    <div class="refresh-dot"></div>
    <div class="refresh-dot"></div>
    <div class="refresh-dot"></div>
  </div>
</div>

<script src="/config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, where }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBEOIQ9wsjHY5GxTG7PIOqLDZzKUrUv-fI",
  authDomain: "salon-citas-piloto.firebaseapp.com",
  projectId: "salon-citas-piloto",
  storageBucket: "salon-citas-piloto.firebasestorage.app",
  messagingSenderId: "322452978480",
  appId: "1:322452978480:web:59cb4121a52166d70526f5"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// Config
document.getElementById('h-logo').innerHTML = CONFIG.negocio.split(' ').slice(0,1).join(' ') + ' <em>' + CONFIG.negocio.split(' ').slice(1).join(' ') + '</em>';
document.title = 'Sala de Espera — ' + CONFIG.negocio;

// Reloj
const mesesN = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const diasSemana = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function actualizarReloj(){
  const ahora = new Date();
  const h = String(ahora.getHours()).padStart(2,'0');
  const m = String(ahora.getMinutes()).padStart(2,'0');
  document.getElementById('reloj').innerHTML = `${h}<span>:</span>${m}`;
  document.getElementById('fecha-hoy').textContent =
    `${diasSemana[ahora.getDay()]}, ${ahora.getDate()} de ${mesesN[ahora.getMonth()]} ${ahora.getFullYear()}`;
}
actualizarReloj();
setInterval(actualizarReloj, 1000);

function horaLabel(h){ const hs=Math.floor(h),ms=Math.round((h-hs)*60); return`${String(hs).padStart(2,'0')}:${String(ms).padStart(2,'0')}`; }
function hoyStr(){ const d=new Date(); return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

async function cargar(){
  try{
    const snap = await getDocs(query(collection(db,'citas'), where('fecha','==',hoyStr())));
    let citas = [];
    snap.forEach(d=>{ const data=d.data(); if(data.estado!=='cancelada'&&data.estado!=='finalizada') citas.push({id:d.id,...data}); });
    citas.sort((a,b)=>a.hora-b.hora);

    const atendiendo = citas.find(c=>c.estado==='en_atencion');
    const cola = citas.filter(c=>c.estado==='confirmada');

    const contenido = document.getElementById('atendiendo-content');
    const indicador = document.getElementById('indicador');
    if(atendiendo){
      indicador.style.display = 'block';
      contenido.innerHTML = `
        <div class="atendiendo-nombre">${atendiendo.cliente?.nombre||'—'}</div>
        <div class="atendiendo-servicio">${atendiendo.servicio}</div>
        <div class="atendiendo-hora">${horaLabel(atendiendo.hora)}</div>`;
    } else {
      indicador.style.display = 'none';
      contenido.innerHTML = `<div class="sin-atencion">Nadie siendo atendido</div>`;
    }

    document.getElementById('cola-num').textContent = cola.length;
    const colaEl = document.getElementById('cola-lista');
    if(!cola.length){
      colaEl.innerHTML = `<div class="cola-vacia"><p>Sin clientes en espera</p></div>`;
    } else {
      colaEl.innerHTML = cola.map((c,i)=>`
        <div class="cola-item">
          <div class="cola-pos">${i+1}</div>
          <div class="cola-info">
            <div class="cola-nombre">${c.cliente?.nombre||'—'}</div>
            <div class="cola-det">${c.servicio}</div>
            ${i===0?'<div class="proximo-badge">Próximo</div>':''}
          </div>
          <div class="cola-hora-badge">${horaLabel(c.hora)}</div>
        </div>`).join('');
    }
  }catch(e){
    document.getElementById('atendiendo-content').innerHTML='<div class="sin-atencion">Sin conexión</div>';
  }
}

cargar();
setInterval(cargar, 15000);
</script>
</body>
</html>
