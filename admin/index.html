<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { background: #F8F8F6; }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card { width: 100%; max-width: 380px; }
    .login-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .login-card p  { color: var(--texto-suave); font-size: 14px; margin-bottom: 24px; }
    .error-msg { background: #FCEBEB; color: #A32D2D; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none; }

    /* Sidebar layout */
    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 220px; min-width: 220px;
      background: var(--superficie);
      border-right: 0.5px solid var(--borde);
      padding: 24px 0;
      display: flex; flex-direction: column;
    }
    .sidebar-logo { padding: 0 20px 24px; font-size: 16px; font-weight: 700; color: var(--primario); border-bottom: 0.5px solid var(--borde); margin-bottom: 12px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px; font-size: 14px; cursor: pointer;
      color: var(--texto-suave); transition: all 0.15s;
      border-left: 3px solid transparent;
    }
    .nav-item:hover { background: var(--superficie-2); color: var(--texto); }
    .nav-item.active { background: #FFF0F5; color: var(--primario); border-left-color: var(--primario); font-weight: 500; }
    .nav-item span { font-size: 16px; }
    .sidebar-footer { margin-top: auto; padding: 16px 20px; border-top: 0.5px solid var(--borde); }
    .main-content { flex: 1; overflow-y: auto; }
    .page-frame { width: 100%; height: 100vh; border: none; }

    #login-section { display: flex; }
    #admin-section  { display: none; }

    @media (max-width: 640px) {
      .sidebar { width: 56px; min-width: 56px; }
      .sidebar-logo, .nav-label, .sidebar-footer { display: none; }
      .nav-item { padding: 14px; justify-content: center; }
    }
  </style>
</head>
<body>

<div id="login-section">
  <div class="login-wrap">
    <div class="card login-card">
      <h1 id="login-titulo">Panel de administración</h1>
      <p id="login-subtitulo">Acceso exclusivo para administradores</p>
      <div class="error-msg" id="error-msg">Usuario o contraseña incorrectos</div>
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="inp-usuario" placeholder="Tu usuario" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:8px" id="btn-login" onclick="iniciarSesion()">
        Entrar
      </button>
    </div>
  </div>
</div>

<div id="admin-section">
  <div class="admin-layout">
    <div class="sidebar">
      <div class="sidebar-logo" id="sidebar-logo">Panel</div>
      <div class="nav-item active" onclick="cargarPagina('agenda')">
        <span>📅</span><span class="nav-label">Agenda</span>
      </div>
      <div class="nav-item" onclick="cargarPagina('disponibilidad')">
        <span>🔒</span><span class="nav-label">Disponibilidad</span>
      </div>
      <div class="nav-item" onclick="cargarPagina('espera')">
        <span>⏳</span><span class="nav-label">Sala de espera</span>
      </div>
      <div class="nav-item" onclick="cargarPagina('servicios')">
        <span>✂️</span><span class="nav-label">Servicios</span>
      </div>
      <div class="nav-item" onclick="cargarPagina('estadisticas')">
        <span>📊</span><span class="nav-label">Estadísticas</span>
      </div>
      <div class="sidebar-footer">
        <button class="btn btn-outline btn-sm" style="width:100%" onclick="cerrarSesion()">Salir</button>
      </div>
    </div>
    <div class="main-content">
      <iframe class="page-frame" id="page-frame" src="pages/agenda.html"></iframe>
    </div>
  </div>
</div>

<script type="module">
import { auth } from '../js/firebase.js';
import { signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

document.getElementById('login-titulo').textContent = 'Panel - ' + CONFIG.negocio;
document.getElementById('sidebar-logo').textContent = CONFIG.negocio;
document.title = 'Admin - ' + CONFIG.negocio;

let timeoutTimer = null;

function resetTimeout() {
  clearTimeout(timeoutTimer);
  timeoutTimer = setTimeout(() => { signOut(auth); }, CONFIG.admin.timeoutMinutos * 60 * 1000);
}

document.addEventListener('mousemove', resetTimeout);
document.addEventListener('keydown', resetTimeout);
document.addEventListener('click', resetTimeout);

onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('admin-section').style.display = 'flex';
    resetTimeout();
  } else {
    document.getElementById('login-section').style.display = 'flex';
    document.getElementById('admin-section').style.display = 'none';
  }
});

window.iniciarSesion = async function() {
  const usuario = document.getElementById('inp-usuario').value.trim();
  const pass    = document.getElementById('inp-pass').value;
  const btn     = document.getElementById('btn-login');
  const err     = document.getElementById('error-msg');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Ingresando...';
  const correo = usuario.includes('@') ? usuario : usuario + '@salon.com';
  try {
    await signInWithEmailAndPassword(auth, correo, pass);
  } catch(e) {
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Entrar';
  }
};

window.cerrarSesion = function() { signOut(auth); };

window.cargarPagina = function(pagina) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById('page-frame').src = `pages/${pagina}.html`;
};

document.getElementById('inp-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.iniciarSesion();
});
</script>
<script src="../config.js"></script>
</body>
</html>
