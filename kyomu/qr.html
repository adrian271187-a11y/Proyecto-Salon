<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QR · Kyomu Nails</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --negro:#141414;
  --carbon:#1C1C1C;
  --gris-o:#222222;
  --gris-m:#2C2C2C;
  --gris-t:#6B6B6B;
  --humo:#D8D8D8;
  --rose:#B8888C;
  --rose-d:#8A5A5E;
  --rose-l:#C9A4A7;
  --gold:#A8843E;
  --gold-l:#C8A96E;
  --linea:rgba(168,132,62,0.18);
  --linea-rose:rgba(184,136,140,0.2);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Lato',sans-serif;
  background:var(--negro);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 70% 50% at 50% 0%, rgba(168,132,62,0.06) 0%, transparent 60%);
  pointer-events:none;
}

.container{
  background:var(--gris-o);
  border-radius:4px;
  padding:40px 32px 36px;
  text-align:center;
  max-width:320px;width:100%;
  border:1px solid var(--linea);
  box-shadow:0 8px 40px rgba(0,0,0,.6);
  position:relative;
}

/* línea decorativa superior */
.container::before{
  content:'';
  position:absolute;top:0;left:20%;right:20%;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

.logo{
  width:64px;height:64px;border-radius:50%;object-fit:cover;
  border:1px solid var(--gold);
  margin:0 auto 18px;display:block;
  box-shadow:0 0 0 5px rgba(168,132,62,0.07);
}

.eyebrow{
  font-size:.6rem;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);font-weight:700;margin-bottom:6px;
}
h1{
  font-family:'Cormorant Garamond',serif;
  color:var(--humo);
  font-size:1.6rem;font-weight:700;letter-spacing:3px;
  text-transform:uppercase;margin-bottom:4px;
}
.tagline{
  color:var(--rose);font-size:.65rem;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:24px;
}

.divider{
  height:1px;
  background:linear-gradient(90deg,transparent,var(--linea),transparent);
  margin:0 0 24px;
}

.qr-box{
  background:var(--gris-m);
  border-radius:4px;padding:18px;
  display:inline-block;
  border:1px solid var(--linea);
  box-shadow:0 4px 20px rgba(0,0,0,.5);
  margin-bottom:18px;
}

.instruccion{
  font-size:.72rem;color:var(--gris-t);
  letter-spacing:.5px;line-height:1.7;margin-bottom:20px;
}
.instruccion strong{color:var(--rose-l);font-weight:400}

.url{
  font-size:.6rem;color:var(--gris-t);
  letter-spacing:.5px;word-break:break-all;
  border-top:1px solid rgba(168,132,62,0.1);
  padding-top:14px;margin-bottom:18px;
}

.btn{
  display:inline-block;
  padding:11px 28px;
  background:transparent;
  color:var(--gold-l);
  border:1px solid var(--linea);
  border-radius:2px;
  cursor:pointer;
  font-family:'Lato',sans-serif;
  font-size:.72rem;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;
  text-decoration:none;
  transition:.2s;
}
.btn:hover{background:rgba(168,132,62,0.1);border-color:var(--gold);}

@media print{
  body{background:#fff}
  .btn{display:none}
  .container{border:none;box-shadow:none;background:#fff}
  h1,h2{color:#222}
  .eyebrow,.tagline{color:#888}
  .qr-box{border:1px solid #ddd;background:#fff}
}
</style>
</head>
<body>
<div class="container">
  <img src="img/logo.jpeg" alt="Kyomu Nails" class="logo" onerror="this.style.display='none'"/>
  <div class="eyebrow">Kyomu Nails</div>
  <h1>Reservá<br/>tu cita</h1>
  <div class="tagline">Arte en tus manos</div>
  <div class="divider"></div>
  <div class="qr-box" id="qrBox"></div>
  <div class="instruccion">Apuntá la cámara al código<br/><strong>sin necesidad de app</strong></div>
  <div class="url" id="qrUrl"></div>
  <button class="btn" onclick="window.print()">Imprimir</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const url = window.location.origin + '/kyomu/cliente/';
document.getElementById('qrUrl').textContent = url;
new QRCode(document.getElementById('qrBox'),{
  text: url, width:180, height:180,
  colorDark:'#1C1C1C',
  colorLight:'#ffffff',
  correctLevel: QRCode.CorrectLevel.H
});
</script>
</body>
</html>
