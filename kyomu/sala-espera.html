<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sala de Espera · Kyomu Nails</title>
<meta name="theme-color" content="#1A1A1A"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --negro:#1A1A1A;--gris-o:#252525;--gris-m:#333333;--gris-t:#888888;
  --humo:#F0F0F0;--blanco:#FFFFFF;
  --rose:#C9A4A7;--rose-d:#A07070;--rose-l:#F0E0E0;
  --gold:#C8A96E;--gold-d:#9A7A46;--gold-l:#E8D5A3;
  --linea:rgba(200,169,110,0.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Lato',sans-serif;background:var(--negro);color:var(--humo);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

/* HEADER */
header{background:linear-gradient(135deg,var(--gris-o) 0%,var(--gris-m) 100%);
  padding:32px 20px 24px;text-align:center;border-bottom:1px solid var(--linea)}
.hlogo{width:88px;height:88px;border-radius:50%;object-fit:cover;
  border:2px solid var(--gold);margin-bottom:14px;box-shadow:0 0 24px rgba(200,169,110,.2);display:block;margin-left:auto;margin-right:auto}
header h1{font-family:'Cormorant Garamond',serif;color:var(--blanco);font-size:2.2rem;font-weight:700;letter-spacing:4px}
header p{color:var(--rose);font-size:.75rem;letter-spacing:2.5px;margin-top:5px;text-transform:uppercase}
.subtitulo{display:inline-block;background:rgba(200,169,110,.12);border:1px solid var(--linea);
  color:var(--gold-l);padding:5px 16px;border-radius:20px;font-size:.72rem;font-weight:700;margin-top:12px;letter-spacing:1px}

/* LIVE */
.live-bar{background:var(--gris-o);display:flex;align-items:center;justify-content:center;
  gap:8px;padding:10px;border-bottom:1px solid var(--linea)}
.dot{width:8px;height:8px;background:#27AE60;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
.live-txt{font-size:.68rem;font-weight:700;color:var(--gris-t);letter-spacing:1.5px;text-transform:uppercase}

/* MAIN */
main{flex:1;max-width:700px;width:100%;margin:0 auto;padding:26px 16px}

/* TURNO */
.turno-card{background:var(--gris-o);border-radius:16px;padding:20px;margin-bottom:12px;
  border:1px solid rgba(200,169,110,.15);border-left:4px solid var(--rose-d);
  display:flex;justify-content:space-between;align-items:center;
  animation:slideIn .4s ease;box-shadow:0 4px 16px rgba(0,0,0,.3)}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.t-nombre{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;color:var(--gold-l)}
.t-srv{font-size:.85rem;color:var(--gris-t);margin-top:4px}
.t-badge{background:rgba(201,164,167,.12);border:1px solid var(--rose-d);
  color:var(--rose);padding:7px 14px;border-radius:20px;font-size:.72rem;
  font-weight:700;text-align:center;white-space:nowrap;margin-left:14px}

/* VACÍO */
.vacio{text-align:center;padding:60px 20px;background:var(--gris-o);
  border-radius:16px;border:1px solid rgba(200,169,110,.1)}
.vacio .icono{font-size:3.5rem;margin-bottom:14px;display:block}
.vacio h2{font-family:'Cormorant Garamond',serif;color:var(--gold-l);font-size:1.5rem;margin-bottom:8px}
.vacio p{color:var(--gris-t);font-size:.88rem}

/* QR */
.qr-section{background:var(--gris-o);border-radius:16px;padding:28px;
  text-align:center;margin-top:24px;border:1px solid var(--linea)}
.qr-section h2{font-family:'Cormorant Garamond',serif;color:var(--gold-l);
  font-size:1.4rem;margin-bottom:6px;letter-spacing:1px}
.qr-section p{color:var(--gris-t);font-size:.82rem;margin-bottom:20px}
.qr-box{background:var(--blanco);border-radius:14px;padding:16px;
  display:inline-block;box-shadow:0 4px 16px rgba(0,0,0,.4);border:2px solid var(--linea)}
.pasos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}
.paso{background:var(--gris-m);border-radius:12px;padding:14px;text-align:center;border:1px solid rgba(200,169,110,.12)}
.paso .num{font-size:1.3rem;margin-bottom:6px}
.paso p{color:var(--gris-t);font-size:.73rem;line-height:1.5}

/* FOOTER */
footer{padding:14px;text-align:center;border-top:1px solid var(--linea);
  font-size:.7rem;color:var(--gris-t);letter-spacing:.5px}
footer span{color:var(--gold)}
</style>
</head>
<body>

<header>
  <img src="img/logo.jpeg" alt="Kyomu Nails" class="hlogo" onerror="this.style.display='none'"/>
  <h1>Kyomu Nails</h1>
  <p>Arte en tus manos</p>
  <div class="subtitulo">Sala de Espera</div>
</header>

<div class="live-bar">
  <div class="dot"></div>
  <span class="live-txt">Actualizando en tiempo real</span>
</div>

<main>
  <div id="contenido"><div style="text-align:center;padding:40px;color:var(--gris-t)">Cargando...</div></div>

  <div class="qr-section">
    <h2>📱 Reservá tu cita</h2>
    <p>Escaneá el código con tu cámara y agendá desde el celular</p>
    <div class="qr-box" id="qrBox"></div>
    <div class="pasos">
      <div class="paso"><div class="num">📷</div><p>Abrí la cámara</p></div>
      <div class="paso"><div class="num">🔗</div><p>Escaneá el QR</p></div>
      <div class="paso"><div class="num">📋</div><p>Elegí servicio y hora</p></div>
      <div class="paso"><div class="num">✅</div><p>¡Confirmá tu cita!</p></div>
    </div>
  </div>
</main>

<footer>Kyomu Nails © 2026 · <span>Arte en tus manos</span></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, where, onSnapshot }
       from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const db=getFirestore(initializeApp({
  apiKey:"AIzaSyCaSmB7zGTDDDNEbPeYm-dqyJY-FP0P14Q",authDomain:"kyomu-nails.firebaseapp.com",
  projectId:"kyomu-nails",storageBucket:"kyomu-nails.firebasestorage.app",
  messagingSenderId:"514396956826",appId:"1:514396956826:web:9356c814010b2c730f9723"
}));

new QRCode(document.getElementById('qrBox'),{
  text:'https://proyecto-salon-production.up.railway.app/kyomu/cliente/',
  width:160,height:160,colorDark:'#A07070',colorLight:'#ffffff',
  correctLevel:QRCode.CorrectLevel.H
});

onSnapshot(query(collection(db,'appointments'),where('estado','in',['en_atencion','confirmada'])),snap=>{
  const en=snap.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.estado==='en_atencion')
    .sort((a,b)=>a.hora.localeCompare(b.hora));
  const div=document.getElementById('contenido');
  if(!en.length){
    div.innerHTML='<div class="vacio"><span class="icono">✨</span><h2>¡Todo tranquilo!</h2><p>No hay clientes en atención en este momento.</p></div>';
    return;
  }
  div.innerHTML=en.map((c,i)=>`
    <div class="turno-card">
      <div>
        <div class="t-nombre">${c.nombre||c.name||'Cliente'}</div>
        <div class="t-srv">💅 ${c.serviceName||c.servicio||'—'} · ⏰ ${c.hora}</div>
      </div>
      <div class="t-badge">En atención${i===0?' 🌸':''}</div>
    </div>`).join('');
});
</script>
</body>
</html>
