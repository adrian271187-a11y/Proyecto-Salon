<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Etiqueta QR · Kyomu Nails</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --negro:#141414;
  --gris-o:#222222;
  --gris-m:#2C2C2C;
  --gris-s:#3A3A3A;
  --gris-t:#6B6B6B;
  --humo:#D8D8D8;
  --rose:#B8888C;
  --rose-d:#8A5A5E;
  --rose-l:#C9A4A7;
  --gold:#A8843E;
  --gold-l:#C8A96E;
  --linea:rgba(168,132,62,0.2);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Lato',sans-serif;
  background:var(--negro);
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;padding:28px 20px;
  -webkit-font-smoothing:antialiased;
}

/* ── CONTROLES ── */
.controles{
  margin-bottom:28px;
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;
}
.controles select{
  padding:9px 16px;
  border:1px solid var(--linea);
  border-radius:2px;
  font-size:.75rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--gold-l);
  background:var(--gris-o);
  cursor:pointer;
  font-family:'Lato',sans-serif;
}
.controles select option{background:var(--gris-o);color:var(--humo)}
.btn-print{
  padding:10px 22px;
  background:transparent;
  color:var(--gold-l);
  border:1px solid var(--linea);
  border-radius:2px;cursor:pointer;
  font-size:.72rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  font-family:'Lato',sans-serif;transition:.2s;
}
.btn-print:hover{background:rgba(168,132,62,0.1);border-color:var(--gold);}
.btn-sec{
  padding:10px 22px;
  background:transparent;
  color:var(--rose-l);
  border:1px solid rgba(184,136,140,0.25);
  border-radius:2px;cursor:pointer;
  font-size:.72rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  font-family:'Lato',sans-serif;transition:.2s;
  text-decoration:none;display:inline-block;
}
.btn-sec:hover{background:rgba(184,136,140,0.08);}

/* ── GRID ETIQUETAS ── */
.etiqueta-wrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}

/* ── ETIQUETA ── */
.etiqueta{
  background:var(--gris-o);
  border-radius:4px;
  border:1px solid var(--linea);
  padding:20px 16px;
  text-align:center;
  width:188px;
  position:relative;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}
/* línea dorada top */
.etiqueta::before{
  content:'';
  position:absolute;top:0;left:15%;right:15%;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

.et-logo{
  width:44px;height:44px;border-radius:50%;object-fit:cover;
  border:1px solid var(--gold);
  margin:0 auto 10px;display:block;
  box-shadow:0 0 0 4px rgba(168,132,62,0.06);
}
.et-eyebrow{
  font-size:.52rem;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--gold);font-weight:700;margin-bottom:3px;
}
.et-nombre{
  font-family:'Cormorant Garamond',serif;
  color:var(--humo);font-size:.95rem;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:2px;
}
.et-slogan{font-size:.55rem;color:var(--gris-t);letter-spacing:1.5px;margin-bottom:12px;text-transform:uppercase}

.et-divider{
  height:1px;
  background:linear-gradient(90deg,transparent,var(--linea),transparent);
  margin:0 0 12px;
}

.et-qr{
  background:var(--gris-m);
  border-radius:4px;padding:10px;
  display:inline-block;
  border:1px solid rgba(168,132,62,0.15);
  margin-bottom:10px;
}

.et-scan{
  font-size:.56rem;color:var(--rose-l);font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;
}
.et-divider2{
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(184,136,140,0.15),transparent);
  margin:0 0 8px;
}
.et-url{font-size:.5rem;color:var(--gris-t);word-break:break-all;letter-spacing:.3px}

/* ── PRINT ── */
@media print{
  body{background:#fff;padding:10px}
  .controles{display:none}
  .etiqueta-wrap{gap:8px}
  .etiqueta{
    box-shadow:none;
    background:#fff;
    border:1px solid #ccc;
    break-inside:avoid;
  }
  .etiqueta::before{background:linear-gradient(90deg,transparent,#C8A96E,transparent);}
  .et-eyebrow{color:#A8843E}
  .et-nombre,.et-slogan{color:#222}
  .et-qr{background:#fff;border:1px solid #ddd;}
  .et-scan{color:#8A5A5E}
  .et-url{color:#999}
}
</style>
</head>
<body>

<div class="controles">
  <select id="cantSel" onchange="renderEtiquetas()">
    <option value="1">1 etiqueta</option>
    <option value="2">2 etiquetas</option>
    <option value="4" selected>4 etiquetas</option>
    <option value="6">6 etiquetas</option>
    <option value="9">9 etiquetas</option>
  </select>
  <button class="btn-print" onclick="window.print()">Imprimir</button>
  <a class="btn-sec" href="sala-espera.html">← Sala espera</a>
</div>

<div class="etiqueta-wrap" id="etiquetaWrap"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const APP_URL = window.location.origin + '/kyomu/cliente/';

function crearEtiqueta(idx){
  const div = document.createElement('div');
  div.className = 'etiqueta';
  div.innerHTML = `
    <img src="img/logo.jpeg" alt="KN" class="et-logo" onerror="this.style.display='none'"/>
    <div class="et-eyebrow">Kyomu Nails</div>
    <div class="et-nombre">Reservá</div>
    <div class="et-slogan">Arte en tus manos</div>
    <div class="et-divider"></div>
    <div class="et-qr" id="qr-${idx}"></div>
    <div class="et-scan">📷 Escaneá para reservar</div>
    <div class="et-divider2"></div>
    <div class="et-url">${APP_URL}</div>
  `;
  return div;
}

function renderEtiquetas(){
  const wrap = document.getElementById('etiquetaWrap');
  wrap.innerHTML = '';
  const cant = parseInt(document.getElementById('cantSel').value);
  for(let i = 0; i < cant; i++){
    const et = crearEtiqueta(i);
    wrap.appendChild(et);
    setTimeout(()=>{
      new QRCode(document.getElementById('qr-'+i),{
        text: APP_URL,
        width: 108, height: 108,
        colorDark: '#1C1C1C',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
    }, i * 50);
  }
}

renderEtiquetas();
</script>
</body>
</html>
