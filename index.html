<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citas</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .hero {
      background: linear-gradient(135deg, #FFF0F5 0%, #FFF8FA 100%);
      padding: 60px 24px 40px;
      text-align: center;
      border-bottom: 0.5px solid var(--borde);
    }
    .hero h1 { font-size: 32px; font-weight: 700; color: var(--primario); margin-bottom: 8px; }
    .hero p  { font-size: 17px; color: var(--texto-suave); }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 16px; }
    .service-card {
      background: var(--superficie);
      border: 0.5px solid var(--borde);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s;
    }
    .service-card:hover { border-color: var(--primario); box-shadow: var(--sombra); }
    .service-card.selected { border-color: var(--primario); background: #FFF0F5; }
    .service-name { font-weight: 500; font-size: 16px; }
    .service-meta { font-size: 13px; color: var(--texto-suave); margin-top: 2px; }
    .service-price { font-size: 17px; font-weight: 600; color: var(--primario); }
    .check-icon { width: 22px; height: 22px; border-radius: 50%; background: var(--primario); display: flex; align-items: center; justify-content: center; color: white; font-size: 13px; opacity: 0; transition: opacity 0.2s; }
    .service-card.selected .check-icon { opacity: 1; }
    .sticky-bottom {
      position: sticky;
      bottom: 0;
      background: var(--superficie);
      border-top: 0.5px solid var(--borde);
      padding: 16px 24px;
      display: none;
    }
    .sticky-bottom.visible { display: block; }
    .empty-state { text-align: center; padding: 48px 16px; color: var(--texto-suave); }
  </style>
</head>
<body>

<div class="hero">
  <h1 id="negocio-nombre">Salón de Belleza</h1>
  <p id="negocio-slogan">Tu belleza, nuestra pasión</p>
</div>

<div class="container">
  <p class="section-title">Elegí tu servicio</p>
  <div id="lista-servicios">
    <div class="spinner"></div>
  </div>
</div>

<div class="sticky-bottom" id="sticky-btn">
  <button class="btn btn-primary" style="width:100%" onclick="irAReserva()">
    Continuar con la reserva →
  </button>
</div>

<div class="container" style="margin-top:0;padding-top:0">
  <hr style="border:none;border-top:0.5px solid var(--borde);margin:8px 0 28px">
  <p class="section-title">¿Tenés una cita agendada?</p>
  <div class="card" style="margin-bottom:12px">
    <p style="font-size:14px;color:var(--texto-suave);margin-bottom:16px">Ingresá tu correo o teléfono para ver y cancelar tu cita.</p>
    <div class="form-group">
      <label>Correo o teléfono</label>
      <input type="text" id="inp-buscar" placeholder="tu@correo.com o 8888-8888">
    </div>
    <button class="btn btn-outline" style="width:100%" onclick="buscarCita()">Buscar mi cita</button>
  </div>
  <div id="resultado-cita"></div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="config.js"></script>
<script>emailjs.init(CONFIG.emailjs.publicKey);</script>
<script type="module">
import { db } from './js/firebase.js';
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const nombre = document.getElementById('negocio-nombre');
const slogan = document.getElementById('negocio-slogan');
nombre.textContent = CONFIG.negocio;
slogan.textContent = CONFIG.slogan;
document.title = CONFIG.negocio;

let servicioSeleccionado = null;

async function cargarServicios() {
  const lista = document.getElementById('lista-servicios');
  try {
    const snap = await getDocs(collection(db, 'servicios'));
    let servicios = [];
    snap.forEach(doc => {
      const d = doc.data();
      if (d.activo !== false) servicios.push({ id: doc.id, ...d });
    });
    if (servicios.length === 0) servicios = CONFIG.servicios.filter(s => s.activo);

    if (servicios.length === 0) {
      lista.innerHTML = '<div class="empty-state">No hay servicios disponibles por el momento.</div>';
      return;
    }

    lista.innerHTML = servicios.map(s => `
      <div class="service-card" id="srv-${s.id}" onclick="seleccionar('${s.id}', '${s.nombre}', ${s.duracion}, ${s.precio})">
        <div>
          <div class="service-name">${s.nombre}</div>
          <div class="service-meta">⏱ ${s.duracion} min</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          ${s.precio > 0 ? `<span class="service-price">₡${s.precio.toLocaleString()}</span>` : ''}
          <div class="check-icon">✓</div>
        </div>
      </div>
    `).join('');
  } catch(e) {
    const servicios = CONFIG.servicios.filter(s => s.activo);
    lista.innerHTML = servicios.map(s => `
      <div class="service-card" id="srv-${s.id}" onclick="seleccionar('${s.id}', '${s.nombre}', ${s.duracion}, ${s.precio})">
        <div>
          <div class="service-name">${s.nombre}</div>
          <div class="service-meta">⏱ ${s.duracion} min</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          ${s.precio > 0 ? `<span class="service-price">₡${s.precio.toLocaleString()}</span>` : ''}
          <div class="check-icon">✓</div>
        </div>
      </div>
    `).join('');
  }
}

window.seleccionar = function(id, nombre, duracion, precio) {
  document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('srv-' + id).classList.add('selected');
  servicioSeleccionado = { id, nombre, duracion, precio };
  document.getElementById('sticky-btn').classList.add('visible');
  sessionStorage.setItem('servicio', JSON.stringify(servicioSeleccionado));
};

window.irAReserva = function() {
  if (!servicioSeleccionado) return;
  window.location.href = 'pages/booking.html';
};

cargarServicios();

const mesesNom = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function horaLabel(h) {
  const hs = Math.floor(h), ms = Math.round((h - hs) * 60);
  return `${String(hs).padStart(2,'0')}:${String(ms).padStart(2,'0')}`;
}
function fechaLabel(f) {
  const [anio, mes, dia] = f.split('-');
  return `${parseInt(dia)} de ${mesesNom[parseInt(mes)-1]} de ${anio}`;
}

window.buscarCita = async function() {
  const buscar = document.getElementById('inp-buscar').value.trim();
  if (!buscar) { mostrarToast('Ingresá tu correo o teléfono', 'error'); return; }

  const resultado = document.getElementById('resultado-cita');
  resultado.innerHTML = '<div class="spinner"></div>';

  try {
    const hoy = new Date().toISOString().split('T')[0];
    let citas = [];

    const esCorrEo = buscar.includes('@');
    const campo = esCorrEo ? 'cliente.correo' : 'cliente.telefono';

    const { getDocs, query, where } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const { collection } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");

    const snap = await getDocs(query(
      collection(db, 'citas'),
      where(campo, '==', buscar),
      where('fecha', '>=', hoy)
    ));

    snap.forEach(d => {
      const data = d.data();
      if (data.estado !== 'cancelada' && data.estado !== 'finalizada') {
        citas.push({ id: d.id, ...data });
      }
    });

    if (citas.length === 0) {
      resultado.innerHTML = `<div class="empty-state" style="padding:20px 0">No encontramos citas activas con ese dato.</div>`;
      return;
    }

    citas.sort((a, b) => a.fecha.localeCompare(b.fecha));

    resultado.innerHTML = citas.map(c => `
      <div class="card" style="margin-bottom:12px;border-left:3px solid var(--primario)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span style="font-weight:600;font-size:16px">${c.servicio}</span>
          <span class="badge badge-${c.estado}">${c.estado}</span>
        </div>
        <div style="font-size:14px;color:var(--texto-suave);margin-bottom:4px">📅 ${fechaLabel(c.fecha)}</div>
        <div style="font-size:14px;color:var(--texto-suave);margin-bottom:14px">🕐 ${horaLabel(c.hora)}</div>
        <button class="btn btn-danger btn-sm" style="width:100%"
          onclick="cancelarCita('${c.id}','${c.servicio}','${c.fecha}',${c.hora},'${c.cliente?.nombre}','${c.cliente?.correo}')">
          Cancelar esta cita
        </button>
      </div>
    `).join('');
  } catch(e) {
    resultado.innerHTML = '<p class="text-muted">Error al buscar. Intentá de nuevo.</p>';
  }
};

window.cancelarCita = async function(id, servicio, fecha, hora, clienteNombre, clienteCorreo) {
  if (!confirm('¿Estás seguro que querés cancelar esta cita?')) return;
  try {
    const { doc, updateDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    await updateDoc(doc(db, 'citas', id), { estado: 'cancelada' });

    const fechaStr = fechaLabel(fecha);
    const horaStr  = horaLabel(hora);

    await emailjs.send(CONFIG.emailjs.serviceId, CONFIG.emailjs.templateCancelacion, {
      negocio: CONFIG.negocio,
      destinatario_nombre: clienteNombre,
      correo_destinatario: clienteCorreo,
      cliente_nombre: clienteNombre,
      servicio, fecha: fechaStr, hora: horaStr,
      mensaje_extra: 'Si necesitás reagendar, podés hacerlo desde nuestra página.'
    });

    if (CONFIG.contacto.correoAdmin) {
      await emailjs.send(CONFIG.emailjs.serviceId, CONFIG.emailjs.templateCancelacion, {
        negocio: CONFIG.negocio,
        destinatario_nombre: 'Administrador',
        correo_destinatario: CONFIG.contacto.correoAdmin,
        cliente_nombre: clienteNombre,
        servicio, fecha: fechaStr, hora: horaStr,
        mensaje_extra: 'El cliente canceló su cita desde la página web.'
      });
    }

    document.getElementById('resultado-cita').innerHTML = `
      <div class="card" style="text-align:center;padding:24px">
        <div style="font-size:36px;margin-bottom:12px">✕</div>
        <p style="font-weight:600;margin-bottom:6px">Cita cancelada</p>
        <p class="text-muted">Tu cita de ${servicio} del ${fechaStr} fue cancelada. Te enviamos un correo de confirmación.</p>
      </div>
    `;
    mostrarToast('Cita cancelada correctamente');
  } catch(e) {
    mostrarToast('Error al cancelar. Intentá de nuevo.', 'error');
  }
};

function mostrarToast(msg, tipo = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show ' + tipo;
  setTimeout(() => t.className = '', 3000);
}
</script>
</body>
</html>
